name: cicd pipeline

on: push

jobs:
  run-test-cases:
    name: Running Automated Tests in Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install pytest
        run: pip install pytest

      - name: Run test cases
        run: pytest test.py -v